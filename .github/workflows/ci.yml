name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create reproducible .env from repo
        run: |
          test -f .env.rb || (echo ".env.rb is required for reproducible builds" && exit 1)
          cp .env.rb .env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Icon Packs
        run: dart run flutter_iconpicker:generate_packs --packs fontAwesomeIcons

      - name: Analyze and Test
        run: |
          flutter analyze
          flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create reproducible .env from repo
        run: |
          test -f .env.rb || (echo ".env.rb is required for reproducible builds" && exit 1)
          cp .env.rb .env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Icon Packs
        run: dart run flutter_iconpicker:generate_packs --packs fontAwesomeIcons

      - name: Build Unsigned APK
        run: |
          flutter build apk --release --flavor mainstream --split-per-abi --no-tree-shake-icons

      - name: Upload Unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          path: build/app/outputs/flutter-apk/*-release.apk

  build-android-izzy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create reproducible .env from repo
        run: |
          test -f .env.rb || (echo ".env.rb is required for reproducible builds" && exit 1)
          cp .env.rb .env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: "stable"

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Resolve dependencies for izzy
        run: ./scripts/with_izzy_overrides.sh flutter pub get

      - name: Verify no RevenueCat SDK in dependency graph
        run: |
          if ./scripts/with_izzy_overrides.sh flutter pub deps | grep -i "revenuecat"; then
            echo "RevenueCat dependency detected in izzy build graph"
            exit 1
          fi

      - name: Generate Icon Packs
        run: ./scripts/with_izzy_overrides.sh dart run flutter_iconpicker:generate_packs --packs fontAwesomeIcons

      - name: Build Izzy Unsigned APK
        run: |
          ./scripts/with_izzy_overrides.sh flutter build apk --release --flavor izzy --dart-define=ENABLE_REVENUECAT=false --split-per-abi --no-tree-shake-icons

      - name: Upload Izzy Unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks-izzy
          path: build/app/outputs/flutter-apk/*izzy-release.apk
