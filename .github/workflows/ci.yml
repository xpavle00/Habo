name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create reproducible .env from repo
        run: |
          test -f .env.rb || (echo ".env.rb is required for reproducible builds" && exit 1)
          cp .env.rb .env

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Icon Packs
        run: dart run flutter_iconpicker:generate_packs --packs fontAwesomeIcons

      - name: Analyze and Test
        run: |
          flutter analyze
          flutter test

  build-android-izzy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Create reproducible .env from repo
        run: |
          test -f .env.rb || (echo ".env.rb is required for reproducible builds" && exit 1)
          cp .env.rb .env

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: "stable"

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Resolve dependencies for izzy
        run: ./scripts/with_izzy_overrides.sh flutter pub get

      - name: Verify RevenueCat SDK is stubbed out (not the real pub.dev package)
        run: |
          set -euo pipefail
          # The real RevenueCat SDK and the local stubs share the same package
          # names and version, so only the dependency *source* distinguishes
          # them: the stubs resolve via a path override, the real SDK via pub.dev
          # (hosted). Assert both resolve to the local path stub.
          deps_json="$(./scripts/with_izzy_overrides.sh flutter pub deps --json 2>/dev/null)"
          for pkg in purchases_flutter purchases_ui_flutter; do
            source="$(printf '%s' "$deps_json" | jq -r --arg p "$pkg" \
              '[.packages[] | select(.name == $p) | .source] | first // "absent"')"
            echo "$pkg resolved from source: $source"
            if [ "$source" != "path" ]; then
              echo "::error::$pkg did not resolve to the local stub (source=$source); the real RevenueCat SDK may be bundled in the izzy build."
              exit 1
            fi
          done
          echo "OK: RevenueCat packages resolve to local path stubs."

      - name: Generate Icon Packs
        run: ./scripts/with_izzy_overrides.sh dart run flutter_iconpicker:generate_packs --packs fontAwesomeIcons

      - name: Build Izzy Unsigned APK
        run: |
          ./scripts/with_izzy_overrides.sh flutter build apk --release --flavor izzy --dart-define=ENABLE_REVENUECAT=false --split-per-abi --no-tree-shake-icons

      - name: Upload Izzy Unsigned APKs
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-apks-izzy
          path: build/app/outputs/flutter-apk/*izzy-release.apk
